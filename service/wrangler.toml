name = "before-another-bottle"
main = "worker.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[assets]
directory = "../web/dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
YOUCAM_MODE = "mock"
# Provider storage host observed in the 10/24 18:33 live smoke (upload PUT + all 4 mask GETs). Live mode fails closed without it.
YOUCAM_STORAGE_HOST_SUFFIXES = "yce-us.s3-accelerate.amazonaws.com"
# Keep this placeholder in source; set the real ID in untracked wrangler.deploy.toml.
[[d1_databases]]
binding = "DB"
database_name = "breakout-log"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["*/15 * * * *"]
